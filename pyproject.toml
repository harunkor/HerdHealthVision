[project]
name = "herd-health-vision"
version = "0.1.0"
description = "Livestock disease pre-screening from images"
requires-python = ">=3.10"
dependencies = ["torch>=2.2","torchvision>=0.17","timm>=1.0","pillow>=10.0","pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
